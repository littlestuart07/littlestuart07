<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Suyash Agrawaal — Data Science, Machine Learning, Full-Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <!-- ambient glows -->
  <ellipse cx="150" cy="60" rx="300" ry="180" fill="url(#glowA)"/>
  <ellipse cx="880" cy="220" rx="320" ry="190" fill="url(#glowB)"/>

  <!-- neural-network motif, right side -->
  <g stroke="#a5b4fc" stroke-opacity="0.30" stroke-width="1.1" fill="none">
    <path d="M812 70 L884 130 M812 70 L884 70 M812 130 L884 70 M812 130 L884 130 M812 190 L884 130 M812 190 L884 190"/>
    <path d="M884 70 L950 130 M884 130 L950 130 M884 190 L950 130"/>
    <path d="M760 130 L812 70 M760 130 L812 130 M760 130 L812 190"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="760" cy="130" r="4.5" fill-opacity="0.95"/>
    <circle cx="812" cy="70" r="4" fill-opacity="0.8"/>
    <circle cx="812" cy="130" r="4" fill-opacity="0.8"/>
    <circle cx="812" cy="190" r="4" fill-opacity="0.8"/>
    <circle cx="884" cy="70" r="4" fill-opacity="0.7"/>
    <circle cx="884" cy="130" r="4" fill-opacity="0.7"/>
    <circle cx="884" cy="190" r="4" fill-opacity="0.7"/>
    <circle cx="950" cy="130" r="5.5" fill="#e9d5ff" fill-opacity="0.95"/>
  </g>

  <!-- accent bar -->
  <rect x="60" y="72" width="4" height="116" rx="2" fill="url(#nameGrad)"/>

  <!-- eyebrow -->
  <text x="84" y="86"
        font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="4.5" fill="#a5b4fc" fill-opacity="0.9">
    B.TECH DATA SCIENCE · VIT CHENNAI
  </text>

  <!-- name -->
  <text x="84" y="146"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1" fill="url(#nameGrad)">
    Suyash Agrawaal
  </text>

  <!-- subtitle -->
  <text x="84" y="182"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="#cbd5e1" fill-opacity="0.92">
    Machine Learning · Data Analytics · Full-Stack Development
  </text>

  <!-- chips -->
  <g font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Courier New', monospace" font-size="12.5">
    <rect x="84" y="200" width="86" height="26" rx="13" fill="#667eea" fill-opacity="0.20" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="127" y="217.5" fill="#c7d2fe" text-anchor="middle">Python</text>

    <rect x="178" y="200" width="118" height="26" rx="13" fill="#667eea" fill-opacity="0.20" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="237" y="217.5" fill="#c7d2fe" text-anchor="middle">TypeScript</text>

    <rect x="304" y="200" width="86" height="26" rx="13" fill="#667eea" fill-opacity="0.20" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="347" y="217.5" fill="#c7d2fe" text-anchor="middle">ML / AI</text>

    <rect x="398" y="200" width="98" height="26" rx="13" fill="#667eea" fill-opacity="0.20" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="447" y="217.5" fill="#c7d2fe" text-anchor="middle">Next.js</text>
  </g>

  <!-- bottom rule -->
  <rect x="0" y="256" width="1000" height="4" fill="url(#rule)"/>
</svg>
